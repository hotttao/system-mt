version: '3'
services:
  nginx:
    image: nginx_quant:1.0.1
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./conf.d/default.conf:/etc/nginx/conf.d/default.conf  # 挂载自定义配置[4,6](@ref)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 兼容性配置（Docker 20.10+）[5](@ref)
    restart: unless-stopped