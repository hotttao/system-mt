server {
    listen 80;
    server_name quant;

    # 代理 /app 路径到宿主机本地的 8080 端口
    location /api {
        proxy_pass http://host.docker.internal:8080;  # 关键：通过特殊域名访问宿主机[5](@ref)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 添加对 WebSocket 的支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Accept $http_sec_websocket_accept;
        proxy_cache_bypass $http_upgrade;
    }

    # 其他请求处理（可选）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /anomaly {
        alias /usr/share/nginx/anomaly;  # 使用alias指向anomaly项目的静态文件目录
        try_files $uri $uri/ /anomaly/index.html;  # SPA路由处理，注意路径要包含/anomaly
    }
}
