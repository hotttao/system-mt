apiVersion: v1
kind: Service
metadata:
  name: conductor
  namespace: conductor
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: conductor
  ports:
    - name: api
      port: 8080
      targetPort: api
      nodePort: 30080
    - name: ui
      port: 5000
      targetPort: ui
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  namespace: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conductor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductor
        app.kubernetes.io/part-of: conductor
    spec:
      containers:
        - name: conductor
          image: conductoross/conductor:3.32.4
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PROP
              value: config-postgres.properties
            - name: JAVA_OPTS
              value: -Dpolyglot.engine.WarnInterpreterOnly=false
            - name: conductor.app.ownerEmailMandatory
              value: "false"
            - name: conductor.workflow-execution-lock.type
              value: postgres
          ports:
            - name: api
              containerPort: 8080
            - name: ui
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
