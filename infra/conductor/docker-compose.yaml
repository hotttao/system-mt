name: conductor

services:
  conductor:
    image: ${CONDUCTOR_IMAGE:-conductoross/conductor:3.32.4}
    environment:
      CONFIG_PROP: config-postgres.properties
      JAVA_OPTS: -Dpolyglot.engine.WarnInterpreterOnly=false
      conductor.app.ownerEmailMandatory: "false"
      conductor.workflow-execution-lock.type: postgres
    depends_on:
      postgresdb:
        condition: service_healthy
    ports:
      - "${CONDUCTOR_BIND_ADDRESS:-192.168.2.41}:${CONDUCTOR_API_PORT:-8080}:8080"
      - "${CONDUCTOR_BIND_ADDRESS:-192.168.2.41}:${CONDUCTOR_UI_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  postgresdb:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
