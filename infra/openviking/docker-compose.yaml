services:
  openviking:
    image: ghcr.io/volcengine/openviking:v0.4.20
    container_name: openviking
    ports:
      - "${OPENVIKING_BIND_ADDRESS:-192.168.2.41}:${OPENVIKING_SERVER_PORT:-1933}:${OPENVIKING_SERVER_PORT:-1933}"
    volumes:
      - openviking-data:/app/.openviking
      - ./config/ov.conf:/app/.openviking/ov.conf:ro
    environment:
      OPENVIKING_SERVER_PORT: ${OPENVIKING_SERVER_PORT:-1933}
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  openviking-data:
